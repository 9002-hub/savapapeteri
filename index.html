<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ledger POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF2EF;
    --surface:#FFFFFF;
    --ink:#16211F;
    --muted:#6B7570;
    --border:#DCE3DE;
    --primary:#1F4B43;
    --primary-dark:#153733;
    --accent:#E2A33B;
    --accent-dark:#C4872A;
    --danger:#B3413A;
    --success:#3E7D5A;
    --radius:10px;
    --radius-lg:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  .num, .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; }
  input, select{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--ink); }

  /* ---------- App shell ---------- */
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  .topbar{
    background:var(--primary);
    color:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
  }
  .topbar .brand{ display:flex; align-items:center; gap:10px; }
  .topbar .brand .mark{
    width:30px;height:30px;border-radius:8px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:var(--primary-dark);font-size:15px;
  }
  .topbar .brand .name{ font-weight:600; font-size:16px; letter-spacing:.2px; }
  .topbar .who{ display:flex; align-items:center; gap:10px; font-size:13px; opacity:.92; }
  .topbar .who .role-pill{
    background:rgba(255,255,255,.15); padding:2px 9px; border-radius:20px; font-size:11px;
  }
  .topbar .logout{
    background:none;border:1px solid rgba(255,255,255,.4);color:#fff;
    padding:6px 12px;border-radius:20px;font-size:13px;
  }

  main.content{ flex:1; padding:14px; padding-bottom:88px; max-width:980px; width:100%; margin:0 auto; }

  .bottomnav{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    z-index:40;
  }
  .bottomnav button{
    flex:1; background:none; border:none; display:flex; flex-direction:column;
    align-items:center; gap:3px; padding:8px 2px; border-radius:10px; color:var(--muted);
    font-size:11.5px;
  }
  .bottomnav button.active{ color:var(--primary); background:#EEF6F2; }
  .bottomnav svg{ width:20px; height:20px; }

  /* ---------- Generic components ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:16px;
  }
  .section-title{ font-size:13px; font-weight:600; text-transform:none; color:var(--muted); margin:0 0 10px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:var(--radius); padding:11px 16px; font-size:14px; font-weight:600;
  }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-primary:active{ background:var(--primary-dark); }
  .btn-accent{ background:var(--accent); color:#231404; }
  .btn-accent:active{ background:var(--accent-dark); }
  .btn-ghost{ background:transparent; color:var(--primary); border:1px solid var(--border); }
  .btn-danger{ background:transparent; color:var(--danger); border:1px solid #E7C9C6; }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:.45; }

  input[type=text], input[type=number], input[type=password], select{
    width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:var(--radius);
    font-size:14px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  label{ font-size:12.5px; color:var(--muted); display:block; margin-bottom:5px; }
  .field{ margin-bottom:12px; }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }

  .badge{ font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; }
  .badge-low{ background:#FBE9E7; color:var(--danger); }
  .badge-ok{ background:#E8F3EC; color:var(--success); }

  .empty{ text-align:center; color:var(--muted); padding:32px 12px; font-size:14px; }

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--primary); padding:24px;
  }
  .login-brand{ text-align:center; margin-bottom:28px; }
  .login-brand .mark{
    width:56px;height:56px;border-radius:14px;background:var(--accent);margin:0 auto 12px;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;color:var(--primary-dark);
  }
  .login-brand h1{ color:#fff; font-size:22px; margin:0 0 4px; }
  .login-brand p{ color:rgba(255,255,255,.7); margin:0; font-size:13px; }
  .login-card{ background:var(--surface); border-radius:var(--radius-lg); padding:20px; width:100%; max-width:340px; }
  .user-pick{
    display:flex; align-items:center; gap:12px; width:100%; padding:13px; border-radius:var(--radius);
    border:1px solid var(--border); background:#fff; margin-bottom:9px;
  }
  .user-pick .avatar{
    width:36px;height:36px;border-radius:50%;background:#EEF6F2;color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;
  }
  .user-pick .info{ text-align:left; flex:1; }
  .user-pick .info .n{ font-weight:600; font-size:14.5px; }
  .user-pick .info .r{ font-size:12px; color:var(--muted); }
  .pin-dots{ display:flex; gap:12px; justify-content:center; margin:18px 0; }
  .pin-dots .d{ width:14px;height:14px;border-radius:50%;border:2px solid var(--border); }
  .pin-dots .d.filled{ background:var(--primary); border-color:var(--primary); }
  .pin-pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pin-pad button{
    padding:16px 0; border-radius:var(--radius); border:1px solid var(--border); background:#fff;
    font-size:18px; font-weight:600; font-family:'IBM Plex Mono',monospace;
  }
  .pin-pad button:active{ background:#F1F1F1; }
  .pin-error{ color:var(--danger); font-size:12.5px; text-align:center; margin-top:6px; min-height:16px; }
  .back-link{ text-align:center; margin-top:12px; }
  .back-link button{ background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline; }

  /* ---------- POS ---------- */
  .pos-grid{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media(min-width:760px){ .pos-grid{ grid-template-columns:1.3fr 1fr; } }
  .search-row{ display:flex; gap:8px; margin-bottom:12px; }
  .search-row input{ flex:1; }
  .scan-btn{ background:var(--primary); color:#fff; border-radius:var(--radius); border:none; padding:0 14px; }
  .product-list{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media(min-width:480px){ .product-list{ grid-template-columns:repeat(3,1fr); } }
  .product-tile{
    background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:12px;
    text-align:left;
  }
  .product-tile:active{ background:#F6F8F6; }
  .product-tile .pn{ font-size:13.5px; font-weight:600; margin-bottom:6px; line-height:1.25; min-height:34px; }
  .product-tile .pp{ font-size:14px; color:var(--primary); font-weight:600; }
  .product-tile .ps{ font-size:11px; color:var(--muted); margin-top:2px; }
  .product-tile:disabled{ opacity:.4; }

  .cart-panel{ background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; display:flex; flex-direction:column; }
  .cart-item{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); }
  .cart-item:last-child{ border-bottom:none; }
  .cart-item .ci-name{ flex:1; font-size:13.5px; }
  .cart-item .ci-name .sub{ display:block; font-size:11px; color:var(--muted); }
  .qty-ctrl{ display:flex; align-items:center; gap:6px; }
  .qty-ctrl button{ width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:#fff;font-weight:700; }
  .cart-totals{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:13.5px; }
  .cart-totals .tline{ display:flex; justify-content:space-between; padding:3px 0; }
  .cart-totals .tline.grand{ font-size:17px; font-weight:700; margin-top:4px; }
  .pay-methods{ display:flex; gap:8px; margin:10px 0; }
  .pay-methods button{ flex:1; padding:9px; border-radius:var(--radius); border:1px solid var(--border); background:#fff; font-size:13px; font-weight:600; }
  .pay-methods button.sel{ background:var(--primary); color:#fff; border-color:var(--primary); }

  /* ---------- Tables ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:11.5px; color:var(--muted); padding:8px 8px; border-bottom:1px solid var(--border); font-weight:600; }
  td{ padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .icon-btn{ background:none; border:none; color:var(--primary); font-size:13px; font-weight:600; padding:4px 6px; }
  .icon-btn.danger{ color:var(--danger); }

  /* ---------- Dashboard ---------- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  @media(min-width:600px){ .kpi-grid{ grid-template-columns:repeat(4,1fr); } }
  .kpi{ background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
  .kpi .v{ font-size:21px; font-weight:700; font-family:'IBM Plex Mono',monospace; }
  .kpi .l{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .bar-row .lbl{ width:92px; font-size:12px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; background:#EEF2EF; border-radius:6px; height:16px; overflow:hidden; }
  .bar-fill{ background:var(--primary); height:100%; border-radius:6px; }
  .bar-val{ width:56px; text-align:right; font-size:12px; flex-shrink:0; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,25,22,.55); display:flex; align-items:flex-end;
    justify-content:center; z-index:100; padding:0;
  }
  @media(min-width:600px){ .modal-overlay{ align-items:center; } }
  .modal{
    background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:440px; max-height:88vh; overflow-y:auto;
    padding:20px;
  }
  @media(min-width:600px){ .modal{ border-radius:16px; } }
  .modal h2{ margin:0 0 14px; font-size:17px; }
  .modal-close{ float:right; background:none; border:none; font-size:20px; color:var(--muted); line-height:1; }
  .receipt-line{ display:flex; justify-content:space-between; font-size:13px; padding:3px 0; font-family:'IBM Plex Mono',monospace; }
  .receipt-divider{ border-top:1px dashed var(--border); margin:8px 0; }
  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:30px; font-size:13px; z-index:200; box-shadow:0 6px 18px rgba(0,0,0,.2);
  }
  .tabs{ display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; }
  .tabs button{ background:#fff; border:1px solid var(--border); padding:8px 14px; border-radius:20px; font-size:13px; white-space:nowrap; }
  .tabs button.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .scan-view{ background:#000; border-radius:var(--radius); overflow:hidden; position:relative; margin-bottom:10px; }
  .scan-view video{ width:100%; display:block; max-height:260px; object-fit:cover; }
  .scan-hint{ position:absolute; bottom:8px; left:0; right:0; text-align:center; color:#fff; font-size:12px; }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* =========================================================
   FIREBASE CONFIG — paste your own project's config here.
   See README.md for step-by-step setup instructions.
========================================================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

/* =========================================================
   STORAGE — Cloud Firestore, shared across every browser and
   device that opens this site. Reads/writes stay synchronous
   from the rest of the app's point of view: everything is kept
   in an in-memory cache (MEM) that is populated on load and
   kept live via onSnapshot listeners, so any change made on one
   device appears on every other open tab within a second or two.
   Falls back to a local-only in-memory store if Firestore can't
   be reached (e.g. no internet, or config not filled in yet).
========================================================= */
const KEYS = ['pos_users','pos_products','pos_sales','pos_settings'];
const MEM = {};
let firestoreOK = true;

const Store = {
  get(key, fallback){
    return (key in MEM) ? MEM[key] : fallback;
  },
  set(key, val){
    MEM[key] = val;
    if(!firestoreOK) return;
    setDoc(doc(db, 'pos', key), { value: val }).catch(err=>{
      console.error('Firestore write failed', err);
      showToast && showToast('⚠ Could not save to cloud — check connection');
    });
  }
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* =========================================================
   SEED DATA (only writes defaults for keys that don't exist yet)
========================================================= */
function seed(){
  if(!Store.get('pos_users')){
    Store.set('pos_users', [
      {id:uid(), name:'Store Admin', role:'admin', pin:'1234'},
      {id:uid(), name:'Cashier One', role:'cashier', pin:'1111'}
    ]);
  }
  if(!Store.get('pos_products')){
    Store.set('pos_products', [
      {id:uid(), name:'White T-Shirt (M)', barcode:'100001', price:12.99, stock:40, category:'Apparel', low:8},
      {id:uid(), name:'Denim Jeans', barcode:'100002', price:34.50, stock:18, category:'Apparel', low:5},
      {id:uid(), name:'Ceramic Mug', barcode:'100003', price:8.00, stock:6, category:'Home', low:10},
      {id:uid(), name:'Notebook A5', barcode:'100004', price:3.25, stock:60, category:'Stationery', low:15},
      {id:uid(), name:'Ballpoint Pen', barcode:'100005', price:0.99, stock:200, category:'Stationery', low:30},
      {id:uid(), name:'Canvas Tote Bag', barcode:'100006', price:15.00, stock:22, category:'Accessories', low:8},
      {id:uid(), name:'Sunglasses', barcode:'100007', price:19.99, stock:9, category:'Accessories', low:5},
      {id:uid(), name:'Water Bottle 1L', barcode:'100008', price:11.50, stock:30, category:'Home', low:10}
    ]);
  }
  if(!Store.get('pos_sales')) Store.set('pos_sales', []);
  if(!Store.get('pos_settings')) Store.set('pos_settings', {storeName:'My Store', taxRate:0, currency:'$'});
}

/* =========================================================
   BOOT — load initial data from Firestore, seed if empty,
   then subscribe to live updates from other devices before
   starting the app.
========================================================= */
async function boot(){
  const appEl = document.getElementById('app');
  appEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:#6B7570;">Connecting to database…</div>';

  try{
    await Promise.all(KEYS.map(async key=>{
      const snap = await getDoc(doc(db, 'pos', key));
      MEM[key] = snap.exists() ? snap.data().value : undefined;
    }));
  }catch(err){
    console.error('Firestore unreachable, falling back to local-only mode', err);
    firestoreOK = false;
  }

  seed();

  if(firestoreOK){
    KEYS.forEach(key=>{
      onSnapshot(doc(db, 'pos', key), snap=>{
        if(snap.metadata.hasPendingWrites) return; // skip echo of our own write
        if(snap.exists()){
          MEM[key] = snap.data().value;
          render();
        }
      }, err=> console.error('Firestore listener error', err));
    });
  }

  render();
}

/* =========================================================
   APP STATE
========================================================= */
let S = {
  user: null,
  view: 'pos',
  cart: [],
  pinBuffer: '',
  pinTarget: null,
  posSearch: '',
  toast: null,
  modal: null,     // {type:'receipt'|'productForm'|'userForm'|'scan', data:{}}
  payMethod: 'Cash',
  reportRange: 7,
};

function showToast(msg){
  S.toast = msg;
  render();
  setTimeout(()=>{ S.toast = null; render(); }, 1800);
}

/* =========================================================
   RENDER ROOT
========================================================= */
function render(){
  const app = document.getElementById('app');
  if(!S.user){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="mark">${(Store.get('pos_settings').storeName||'S')[0].toUpperCase()}</div>
        <div class="name">${escapeHtml(Store.get('pos_settings').storeName)}</div>
      </div>
      <div class="who">
        <span>${escapeHtml(S.user.name)}</span>
        <span class="role-pill">${S.user.role}</span>
        <button class="logout" id="btnLogout">Log out</button>
      </div>
    </div>
    <main class="content" id="content"></main>
    <nav class="bottomnav">
      ${navBtn('pos','Sell', iconCart())}
      ${navBtn('inventory','Inventory', iconBox())}
      ${navBtn('reports','Reports', iconChart())}
      ${S.user.role==='admin' ? navBtn('admin','Admin', iconGear()) : ''}
    </nav>
    ${S.toast ? `<div class="toast">${escapeHtml(S.toast)}</div>` : ''}
    ${S.modal ? renderModal() : ''}
  `;

  const content = document.getElementById('content');
  if(S.view==='pos') content.innerHTML = renderPOS();
  if(S.view==='inventory') content.innerHTML = renderInventory();
  if(S.view==='reports') content.innerHTML = renderReports();
  if(S.view==='admin' && S.user.role==='admin') content.innerHTML = renderAdmin();

  attachShellEvents();
  attachViewEvents();
  if(S.modal) attachModalEvents();
}

function navBtn(view,label,icon){
  return `<button class="${S.view===view?'active':''}" data-nav="${view}">${icon}<span>${label}</span></button>`;
}
function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function money(n){ const c = Store.get('pos_settings').currency||'$'; return c + Number(n).toFixed(2); }

/* =========================================================
   ICONS (inline SVG, stroke uses currentColor)
========================================================= */
function iconCart(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>`; }
function iconBox(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>`; }
function iconChart(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>`; }
function iconGear(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`; }
function iconScan(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V4a1 1 0 0 1 1-1h3"/><path d="M17 3h3a1 1 0 0 1 1 1v3"/><path d="M21 17v3a1 1 0 0 1-1 1h-3"/><path d="M7 21H4a1 1 0 0 1-1-1v-3"/><line x1="4" y1="12" x2="20" y2="12"/></svg>`; }

/* =========================================================
   LOGIN
========================================================= */
function renderLogin(){
  const users = Store.get('pos_users', []);
  if(!S.pinTarget){
    return `
      <div class="login-wrap">
        <div class="login-brand">
          <div class="mark">${(Store.get('pos_settings').storeName||'S')[0].toUpperCase()}</div>

function attachPOSEvents(){
  const search = document.getElementById('posSearch');
  if(search){
    search.oninput = (e)=>{ S.posSearch = e.target.value; render(); document.getElementById('posSearch').focus(); document.getElementById('posSearch').selectionStart = document.getElementById('posSearch').value.length; };
    search.onkeydown = (e)=>{
      if(e.key==='Enter'){
        // barcode-scanner-as-keyboard support: exact barcode match on Enter
        const products = Store.get('pos_products', []);
        const match = products.find(p=>p.barcode===S.posSearch.trim());
        if(match){ addToCart(match.id); S.posSearch=''; render(); }
      }
    };
  }
  const scanBtn = document.getElementById('btnOpenScan');
  if(scanBtn) scanBtn.onclick = ()=>{ S.modal={type:'scan'}; render(); };

  document.querySelectorAll('[data-add]').forEach(el=>{
    el.onclick = ()=>{ addToCart(el.dataset.add); render(); };
  });
  document.querySelectorAll('[data-inc]').forEach(el=> el.onclick=()=>{ changeQty(el.dataset.inc,1); render(); });
  document.querySelectorAll('[data-dec]').forEach(el=> el.onclick=()=>{ changeQty(el.dataset.dec,-1); render(); });
  document.querySelectorAll('[data-pay]').forEach(el=> el.onclick=()=>{ S.payMethod = el.dataset.pay; render(); });

  const clearBtn = document.getElementById('btnClearCart');
  if(clearBtn) clearBtn.onclick = ()=>{ S.cart=[]; render(); };

  const checkoutBtn = document.getElementById('btnCheckout');
  if(checkoutBtn) checkoutBtn.onclick = completeSale;
}

function addToCart(productId){
  const products = Store.get('pos_products', []);
  const p = products.find(x=>x.id===productId);
  if(!p || p.stock<=0) return;
  const existing = S.cart.find(i=>i.id===productId);
  const inCartQty = existing?existing.qty:0;
  if(inCartQty+1 > p.stock){ showToast('Not enough stock'); return; }
  if(existing) existing.qty += 1;
  else S.cart.push({id:p.id, name:p.name, price:p.price, qty:1});
}
function changeQty(productId, delta){
  const item = S.cart.find(i=>i.id===productId);
  if(!item) return;
  const products = Store.get('pos_products', []);
  const p = products.find(x=>x.id===productId);
  const next = item.qty + delta;
  if(next<=0){ S.cart = S.cart.filter(i=>i.id!==productId); return; }
  if(p && next>p.stock){ showToast('Not enough stock'); return; }
  item.qty = next;
}

function completeSale(){
  if(S.cart.length===0) return;
  const products = Store.get('pos_products', []);
  const settings = Store.get('pos_settings');
  const subtotal = S.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const taxAmt = subtotal*((settings.taxRate||0)/100);
  const total = subtotal+taxAmt;

  // decrement stock
  S.cart.forEach(item=>{
    const p = products.find(x=>x.id===item.id);
    if(p) p.stock = Math.max(0, p.stock - item.qty);
  });
  Store.set('pos_products', products);

  const sale = {
    id: uid(),
    timestamp: new Date().toISOString(),
    cashierId: S.user.id,
    cashierName: S.user.name,
    items: S.cart.map(i=>({name:i.name, qty:i.qty, price:i.price})),
    subtotal, tax:taxAmt, total,
    payment: S.payMethod
  };
  const sales = Store.get('pos_sales', []);
  sales.push(sale);
  Store.set('pos_sales', sales);

  S.modal = {type:'receipt', data:sale};
  S.cart = [];
  render();
}

/* ---- Barcode scan modal (real camera + BarcodeDetector where supported) ---- */
let scanStream = null;
function stopScan(){
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
}
async function startScan(){
  const video = document.getElementById('scanVideo');
  const statusEl = document.getElementById('scanStatus');
  if(!('BarcodeDetector' in window)){
    if(statusEl) statusEl.textContent = "Camera scanning isn't supported in this preview. Use manual entry below \u2014 it will work automatically once this is installed as an app.";
    return;
  }
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = scanStream;
    await video.play();
    const detector = new BarcodeDetector();
    const loop = async ()=>{
      if(!scanStream) return;
      try{
        const codes = await detector.detect(video);
        if(codes.length){
          const val = codes[0].rawValue;
          stopScan();
          const products = Store.get('pos_products', []);
          const match = products.find(p=>p.barcode===val);
          if(match){ addToCart(match.id); showToast('Added '+match.name); S.modal=null; render(); }
          else { showToast('No product with barcode '+val); }
          return;
        }
      }catch(err){}
      requestAnimationFrame(loop);
    };
    loop();
  }catch(err){
    if(statusEl) statusEl.textContent = 'Camera unavailable (' + err.message + '). Use manual entry below.';
  }
}

/* =========================================================
   REPORTS
========================================================= */
function renderReports(){
  const isAdmin = S.user.role==='admin';
  let sales = Store.get('pos_sales', []);
  if(!isAdmin) sales = sales.filter(s=>s.cashierId===S.user.id);

  const now = new Date();
  const rangeDays = S.reportRange;
  const rangeStart = new Date(now); rangeStart.setDate(now.getDate()-(rangeDays-1)); rangeStart.setHours(0,0,0,0);
  const inRange = sales.filter(s=> new Date(s.timestamp) >= rangeStart);

  const todayStr = now.toDateString();
  const todaySales = sales.filter(s=> new Date(s.timestamp).toDateString()===todayStr);
  const todayRevenue = todaySales.reduce((s,x)=>s+x.total,0);
  const rangeRevenue = inRange.reduce((s,x)=>s+x.total,0);
  const avgTicket = inRange.length? rangeRevenue/inRange.length : 0;

  // top products
  const prodTotals = {};
  inRange.forEach(s=> s.items.forEach(i=>{ prodTotals[i.name] = (prodTotals[i.name]||0) + i.qty; }));
  const topProducts = Object.entries(prodTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxQty = topProducts.length? topProducts[0][1] : 1;

  // revenue by day
  const dayBuckets = [];
  for(let i=rangeDays-1;i>=0;i--){
    const d = new Date(now); d.setDate(now.getDate()-i);
    const key = d.toDateString();
    const rev = sales.filter(s=>new Date(s.timestamp).toDateString()===key).reduce((s,x)=>s+x.total,0);
    dayBuckets.push({label: d.toLocaleDateString(undefined,{weekday:'short'}), rev});
  }
  const maxRev = Math.max(1, ...dayBuckets.map(d=>d.rev));

  return `
    <div class="tabs">
      ${[7,14,30].map(r=>`<button data-range="${r}" class="${S.reportRange===r?'active':''}">${r} days</button>`).join('')}
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="v">${money(todayRevenue)}</div><div class="l">Today's revenue</div></div>
      <div class="kpi"><div class="v">${todaySales.length}</div><div class="l">Today's transactions</div></div>
      <div class="kpi"><div class="v">${money(rangeRevenue)}</div><div class="l">${rangeDays}-day revenue</div></div>
      <div class="kpi"><div class="v">${money(avgTicket)}</div><div class="l">Avg. ticket</div></div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div class="section-title">Revenue — last ${rangeDays} days</div>
      ${dayBuckets.map(d=>`
        <div class="bar-row">
          <div class="lbl">${d.label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(d.rev/maxRev*100).toFixed(1)}%"></div></div>
          <div class="bar-val num">${money(d.rev)}</div>
        </div>`).join('')}
    </div>

    <div class="card">
      <div class="section-title">Top products</div>
      ${topProducts.length? topProducts.map(([name,qty])=>`
        <div class="bar-row">
          <div class="lbl">${escapeHtml(name)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(qty/maxQty*100).toFixed(1)}%; background:var(--accent);"></div></div>
          <div class="bar-val num">${qty} sold</div>
        </div>`).join('') : '<div class="empty">No sales in this range yet.</div>'}
    </div>
  `;
}

    el.onclick = ()=>{ S.reportRange = parseInt(el.dataset.range,10); render(); };
  });
}

        <button class="btn btn-primary btn-block" id="btnSaveUser">${isEdit?'Save changes':'Add user'}</button>
      </div>
    </div>
  `;
}

function renderStockAdjustModal(p){
  return `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <button class="modal-close" id="modalClose">×</button>
        <h2>Adjust stock — ${escapeHtml(p.name)}</h2>
        <div class="field"><label>Current stock: <b class="num">${p.stock}</b></label></div>
        <div class="field"><label>New stock count</label><input type="number" id="saNew" min="0" value="${p.stock}"></div>
        <button class="btn btn-primary btn-block" id="btnSaveStock">Save</button>
      </div>
    </div>
  `;
}

function renderScanModal(){
  return `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <button class="modal-close" id="modalClose">×</button>
        <h2>Scan barcode</h2>
        <div class="scan-view">
          <video id="scanVideo" playsinline muted></video>
        </div>
        <div id="scanStatus" style="font-size:12.5px; color:var(--muted); margin-bottom:10px;">Point the camera at a barcode…</div>
        <div class="field"><label>Or enter barcode manually</label>
          <div class="row">
            <input type="text" id="manualBarcode" placeholder="e.g. 100001">
            <button class="btn btn-primary" id="btnManualAdd" style="flex:0 0 auto;">Add</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function attachModalEvents(){
  const overlay = document.getElementById('modalOverlay');
  const close = document.getElementById('modalClose');
  const closeModal = ()=>{ stopScan(); S.modal=null; render(); };
  if(close) close.onclick = closeModal;
  if(overlay) overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };

  const newSale = document.getElementById('btnNewSale');
  if(newSale) newSale.onclick = closeModal;

  const saveProduct = document.getElementById('btnSaveProduct');
  if(saveProduct) saveProduct.onclick = ()=>{
    const name = document.getElementById('pfName').value.trim();
    const barcode = document.getElementById('pfBarcode').value.trim();
    const category = document.getElementById('pfCategory').value.trim();
    const price = parseFloat(document.getElementById('pfPrice').value)||0;
    const stock = parseInt(document.getElementById('pfStock').value)||0;
    const low = parseInt(document.getElementById('pfLow').value)||0;
    if(!name || !barcode){ showToast('Name and barcode are required'); return; }
    let products = Store.get('pos_products', []);
    if(S.modal.data.id){
      products = products.map(p=> p.id===S.modal.data.id ? {...p, name,barcode,category,price,stock,low} : p);
    } else {
      products.push({id:uid(), name,barcode,category,price,stock,low});
    }
    Store.set('pos_products', products);
    S.modal=null; render(); showToast('Product saved');
  };

  const saveUser = document.getElementById('btnSaveUser');
  if(saveUser) saveUser.onclick = ()=>{
    const name = document.getElementById('ufName').value.trim();
    const role = document.getElementById('ufRole').value;
    const pin = document.getElementById('ufPin').value.trim();
    if(!name || !/^\\d{4}$/.test(pin)){ showToast('Name and a 4-digit PIN are required'); return; }
    let users = Store.get('pos_users', []);
    if(S.modal.data.id){
      users = users.map(u=> u.id===S.modal.data.id ? {...u, name, role, pin} : u);
    } else {
      users.push({id:uid(), name, role, pin});
    }
    Store.set('pos_users', users);
    S.modal=null; render(); showToast('User saved');
  };

  const saveStock = document.getElementById('btnSaveStock');
  if(saveStock) saveStock.onclick = ()=>{
    const val = parseInt(document.getElementById('saNew').value);
    if(isNaN(val) || val<0){ showToast('Enter a valid number'); return; }
    const products = Store.get('pos_products', []).map(p=> p.id===S.modal.data.id ? {...p, stock:val} : p);
    Store.set('pos_products', products);
    S.modal=null; render(); showToast('Stock updated');
  };

  if(S.modal.type==='scan'){
    startScan();
    const manualAdd = document.getElementById('btnManualAdd');
    manualAdd.onclick = ()=>{
      const val = document.getElementById('manualBarcode').value.trim();
      const products = Store.get('pos_products', []);
      const match = products.find(p=>p.barcode===val);
      if(match){ stopScan(); addToCart(match.id); S.modal=null; render(); showToast('Added '+match.name); }
      else showToast('No product with that barcode');
    };
  }
}

/* =========================================================
   SHELL + VIEW EVENT WIRING
========================================================= */
function attachShellEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ S.view = el.dataset.nav; render(); };
  });
  const logout = document.getElementById('btnLogout');
  if(logout) logout.onclick = ()=>{ S.user=null; S.cart=[]; S.view='pos'; render(); };
}
function attachViewEvents(){
  if(S.view==='pos') attachPOSEvents();
  if(S.view==='inventory') attachInventoryEvents();
  if(S.view==='reports') attachReportsEvents();
  if(S.view==='admin') attachAdminEvents();
}

boot();
</script>
</body>
</html>
